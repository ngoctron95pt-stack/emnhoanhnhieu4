<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I LOVE YOU - 3D Heart Morphing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #020617;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .glow-text {
            text-shadow: 0 0 12px rgba(186, 230, 253, 0.8), 0 0 24px rgba(56, 189, 248, 0.5);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col justify-between min-h-screen">

    <div id="canvas-container"></div>

    <!-- UI Overlay Header & Footer Controls -->
    <div class="relative z-10 flex flex-col justify-between h-full p-6 pointer-events-none">
        <!-- Title & Status -->
        <header class="text-center mt-4">
            <h1 class="text-2xl sm:text-4xl font-extrabold tracking-widest text-sky-100 glow-text uppercase">
                I LOVE YOU
            </h1>
            <p class="text-xs sm:text-sm text-sky-200/70 mt-1 tracking-wider font-light">
                Chạm / Click để biến hình • Di chuyển để xoay 3D
            </p>
        </header>

        <!-- Bottom Controls -->
        <footer class="flex flex-col items-center mb-4 gap-3 pointer-events-auto">
            <button id="toggle-morph-btn" class="px-6 py-2.5 rounded-full bg-sky-500/20 hover:bg-sky-500/40 border border-sky-300/40 backdrop-blur-md text-sky-100 font-medium text-sm transition-all duration-300 shadow-lg shadow-sky-500/20 active:scale-95">
                ✨ Hút Ra Hình Trái Tim ✨
            </button>
            <div class="text-xs text-sky-300/50 tracking-widest uppercase">
                Xanh Pastel • Lấp Lánh Dạ Quang 3D
            </div>
        </footer>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x020617, 0.015);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 32);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        container.appendChild(renderer.domElement);

        // Main rotating Group
        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xe0f2fe, 1.8);
        dirLight.position.set(12, 20, 15);
        scene.add(dirLight);

        const glowLight = new THREE.PointLight(0x7dd3fc, 2.5, 30);
        glowLight.position.set(0, 0, 5);
        mainGroup.add(glowLight);

        function createSparkleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.2, 'rgba(224, 242, 254, 0.9)');
            gradient.addColorStop(0.5, 'rgba(125, 211, 252, 0.4)');
            gradient.addColorStop(1, 'rgba(2, 6, 23, 0)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        const sparkleTexture = createSparkleTexture();

        const PARTICLE_COUNT = 3200;
        const textPoints = [];
        const heartPoints = [];

        // Generate 2D/3D Positions for "I LOVE YOU" using Canvas pixel sampling
        function generateTextPositions() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 128;

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 54px Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('I LOVE YOU', canvas.width / 2, canvas.height / 2);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            const validPixels = [];

            for (let y = 0; y < canvas.height; y += 2) {
                for (let x = 0; x < canvas.width; x += 2) {
                    const index = (y * canvas.width + x) * 4;
                    if (data[index] > 128) {
                        validPixels.push({
                            x: (x - canvas.width / 2) * 0.07,
                            y: -(y - canvas.height / 2) * 0.07,
                            z: (Math.random() - 0.5) * 1.5
                        });
                    }
                }
            }

            // Fill textPoints up to PARTICLE_COUNT
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const pt = validPixels[i % validPixels.length];
                textPoints.push(new THREE.Vector3(
                    pt.x + (Math.random() - 0.5) * 0.2,
                    pt.y + (Math.random() - 0.5) * 0.2,
                    pt.z + (Math.random() - 0.5) * 0.5
                ));
            }
        }

        // Generate 3D Heart parametric positions
        function generateHeartPositions() {
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const t = Math.random() * Math.PI * 2;
                const u = (Math.random() - 0.5) * Math.PI;
                const scale = 0.75;

                // Heart equation in 3D
                const x = 16 * Math.pow(Math.sin(t), 3) * scale;
                const y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale;
                const z = u * 4 * Math.sin(t);

                heartPoints.push(new THREE.Vector3(
                    x + (Math.random() - 0.5) * 1.2,
                    y + (Math.random() - 0.5) * 1.2,
                    z + (Math.random() - 0.5) * 1.2
                ));
            }
        }

        generateTextPositions();
        generateHeartPositions();

        const morphGeometry = new THREE.BufferGeometry();
        const currentPositions = new Float32Array(PARTICLE_COUNT * 3);

        // Initial positions set to Text
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            currentPositions[i * 3] = textPoints[i].x;
            currentPositions[i * 3 + 1] = textPoints[i].y;
            currentPositions[i * 3 + 2] = textPoints[i].z;
        }

        morphGeometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));

        const particleMaterial = new THREE.PointsMaterial({
            color: 0xe0f2fe,
            size: 0.65,
            map: sparkleTexture,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const particleSystem = new THREE.Points(morphGeometry, particleMaterial);
        mainGroup.add(particleSystem);

        const petalMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xdbf4ff,
            emissive: 0x38bdf8,
            emissiveIntensity: 0.2,
            roughness: 0.3,
            metalness: 0.1,
            clearcoat: 0.8,
            transmission: 0.3,
            side: THREE.DoubleSide
        });

        function createPetalGeometry() {
            const geom = new THREE.PlaneGeometry(1, 3.2, 12, 12);
            const pos = geom.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                let x = pos.getX(i);
                let y = pos.getY(i);
                let z = pos.getZ(i);
                let v = (y + 1.6) / 3.2;
                x *= Math.sin(v * Math.PI) * 1.1;
                z += Math.sin(v * Math.PI) * 0.5 - Math.pow(v, 2) * 0.6;
                pos.setXYZ(i, x, y, z);
            }
            geom.computeVertexNormals();
            return geom;
        }

        const petalGeo = createPetalGeometry();
        const lilyPetalGroup = new THREE.Group();
        const PETAL_COUNT = 36;

        for (let i = 0; i < PETAL_COUNT; i++) {
            const petalMesh = new THREE.Mesh(petalGeo, petalMaterial);
            const t = (i / PETAL_COUNT) * Math.PI * 2;
            const scale = 0.75;
            const x = 16 * Math.pow(Math.sin(t), 3) * scale;
            const y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * scale;

            petalMesh.position.set(x, y, 0);
            petalMesh.rotation.z = -Math.atan2(x, y) + Math.PI / 2;
            petalMesh.rotation.x = Math.sin(t) * 0.4;
            petalMesh.scale.set(0, 0, 0); // Hide initially, scale up when in heart form
            lilyPetalGroup.add(petalMesh);
        }
        mainGroup.add(lilyPetalGroup);

        const BG_PARTICLES = 500;
        const bgGeo = new THREE.BufferGeometry();
        const bgPos = new Float32Array(BG_PARTICLES * 3);

        for (let i = 0; i < BG_PARTICLES; i++) {
            bgPos[i * 3] = (Math.random() - 0.5) * 80;
            bgPos[i * 3 + 1] = (Math.random() - 0.5) * 80;
            bgPos[i * 3 + 2] = (Math.random() - 0.5) * 50;
        }
        bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
        const bgParticles = new THREE.Points(bgGeo, particleMaterial);
        scene.add(bgParticles);

        let isHeart = false;
        let morphProgress = 0; // 0 = Text, 1 = Heart

        function toggleMorph() {
            isHeart = !isHeart;
            const btn = document.getElementById('toggle-morph-btn');
            btn.innerHTML = isHeart ? '✨ Gom Lại Thành "I LOVE YOU" ✨' : '✨ Hút Ra Hình Trái Tim ✨';
        }

        document.getElementById('toggle-morph-btn').addEventListener('click', toggleMorph);
        window.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON') toggleMorph();
        });

        let targetRotationX = 0;
        let targetRotationY = 0;

        function onPointerMove(event) {
            let clientX = event.clientX;
            let clientY = event.clientY;

            if (event.touches && event.touches.length > 0) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            }

            const mouseX = (clientX - window.innerWidth / 2) * 0.0012;
            const mouseY = (clientY - window.innerHeight / 2) * 0.0012;

            targetRotationY = mouseX * 2.5;
            targetRotationX = mouseY * 2.0;
        }

        window.addEventListener('mousemove', onPointerMove, false);
        window.addEventListener('touchmove', onPointerMove, { passive: true });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Smooth Interpolation for Morph State (0 -> 1 -> 0)
            const targetProgress = isHeart ? 1 : 0;
            morphProgress += (targetProgress - morphProgress) * 0.04;

            // Update Particle Positions with Bursting/Sucking Morph Effect
            const positions = morphGeometry.attributes.position.array;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const tPt = textPoints[i];
                const hPt = heartPoints[i];

                // Add explosive burst arc during morphing
                const burstFactor = Math.sin(morphProgress * Math.PI) * 3.5;
                const noiseX = Math.sin(time * 3 + i) * burstFactor;
                const noiseY = Math.cos(time * 3 + i) * burstFactor;

                const curX = THREE.MathUtils.lerp(tPt.x, hPt.x, morphProgress) + noiseX * 0.15;
                const curY = THREE.MathUtils.lerp(tPt.y, hPt.y, morphProgress) + noiseY * 0.15;
                const curZ = THREE.MathUtils.lerp(tPt.z, hPt.z, morphProgress);

                positions[i * 3] = curX;
                positions[i * 3 + 1] = curY;
                positions[i * 3 + 2] = curZ;
            }
            morphGeometry.attributes.position.needsUpdate = true;

            // Scale and reveal Lily Petals when morphed into Heart
            lilyPetalGroup.children.forEach((petal) => {
                const s = morphProgress * 0.45;
                petal.scale.set(s, s, s);
            });

            // Smooth 3D Rotation Interaction (Lerp)
            mainGroup.rotation.y += (targetRotationY - mainGroup.rotation.y) * 0.05;
            mainGroup.rotation.x += (targetRotationX - mainGroup.rotation.x) * 0.05;

            // Heartbeat Pulse Animation in Heart State
            if (morphProgress > 0.5) {
                const beat = 1 + Math.sin(time * 3.5) * 0.05 * morphProgress;
                mainGroup.scale.set(beat, beat, beat);
            } else {
                mainGroup.scale.set(1, 1, 1);
            }

            // Twinkle background particles
            bgParticles.rotation.y = time * 0.02;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
